<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>부서 · 사원관리</title>
  <link rel="stylesheet" href="css/basic.css">
  <link rel="stylesheet" href="css/component.css">
  <link rel="stylesheet" href="css/app-shell.css">
  <link rel="stylesheet" href="css/hr.css">
  <script src="js/component.js" defer></script>
</head>
<body>
<script th:inline="javascript">
	// /*[[${변수}]]*/ 뒤에 브라우저용 기본값(문자열, 숫자, 배열 등)을 적어줍니다.
	// 타임리프 데이터가 없는 경우 null이 입력됨
	const error = /*[[${error}]]*/ '';
	const msg = /*[[${msg}]]*/ '';
	// 에러가 발생한 경우 뒤로가기, 아니면 메세지 출력하기
	// falsy한 값(0,'',null) -> false처럼 동작
	// msg에 값이 들어 있으면 메세지를 출력
	if (msg){
		alert(msg);
		//UI.toast(msg, { type: "success" });

		
	}
	
	// 에러 메세지 출력후 뒤로가기
	if (error){
		alert(error);
		history.back();
	}
	
	
</script>
	
  <!-- 공통 메뉴 — templates/hr/_menu.html 참고 (Thymeleaf 전환 시 fragment 로) -->
  <header class="site-header">
    <div class="site-header__inner container container--wide">
      <a class="site-header__brand" href="index.html">👔 사원관리</a>
      <nav class="site-nav hide-mobile" aria-label="주요 메뉴">
        <a href="index.html">사원 목록</a>
        <a href="depts.html" aria-current="page">부서</a>
        <a href="dashboard.html">대시보드</a>
      </nav>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" type="button" data-theme-toggle aria-label="다크 모드 전환">🌓</button>
      <a class="btn btn--primary btn--sm" href="login.html">로그인</a>
    </div>
  </header>

  <main class="app-main container container--wide">
    <div class="page-head">
      <div>
        <h1>부서</h1>
        <p>전체 [[${totalCnt}]]개 부서</p>
      </div>
      <button class="btn btn--primary" type="button" data-modal-open="dept-modal">+ 부서 추가</button>
    </div>
	
	

    <div class="table-wrap">
      <table class="table table--striped">
        <thead>
          <tr><th>코드</th><th>부서명</th><th>근무지</th><th>인원</th><th>평균 급여</th><th>관리</th></tr>
        </thead>
        <tbody>
          
			<tr th:each="dept : ${list}">
				<td th:text="${dept.deptId}">D1</td>
				<td th:text="${dept.deptTitle}">인사관리부</td>
				<!-- -->
				<td th:text="${dept.nationalName}">서울</td>
				<td th:text=" ${dept.cnt == 0 ? '-' : dept.cnt+'명'}">3명</td>
				<td th:text=" ${dept.avg == 0 ? '-' : #numbers.formatInteger(dept.avg, 3, 'COMMA') + '원'}">2,606,000원</td>
				<td class="row-actions"><a href="#" >수정</a></td>
			</tr>
          
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container container--wide row row--between">
      <p>👔 사원관리 · 학습용 프로토타입</p>
      <span class="muted" style="font-size: var(--text-sm)">디자인 시스템: /css/basic.css</span>
    </div>
  </footer>

  <!-- 부서 추가 모달 -->
  <div class="modal" id="dept-modal" data-modal hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="dept-modal-title" style="width: min(440px, 100%)">
      <button class="modal__close" type="button" data-modal-close aria-label="닫기">×</button>
      <h3 class="modal__title" id="dept-modal-title">부서 추가</h3>
      <form name="saveForm" action="/saveDept" method="post" class="modal__body stack" style="--gap: var(--space-4)" data-dept-form>
        <div class="field">
          <label class="label" for="d-code">부서 코드 *</label>
          <input class="input" id="d-code" placeholder="D10" name="deptId" required>
        </div>
        <div class="field">
          <label class="label" for="d-name">부서명 *</label>
          <input class="input" id="d-name" placeholder="신사업개발부" required name="deptTitle">
        </div>
        <div class="field">
          <label class="label" for="d-loc">근무지</label>
          <select class="select" id="d-loc" name="locationId">
            <option value="L1">서울</option>
			<option value="L2">일본</option>
			<option value="L3">중국</option>
			<option value="L4">미국</option>
			<option value="L5">러시아</option>
          </select>
        </div>
      </form>
      <div class="modal__footer">
        <button class="btn btn--secondary" type="button" data-modal-close>취소</button>
		<!-- 서브밋 버튼 만들기
			1. type을 submit
			2. 자바스크립트를 활용
		-->
		
        <button class="btn btn--primary" type="button" id="dept-save">추가</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("dept-save").addEventListener("click", function () {
        //UI.modal.close("dept-modal");
        //UI.toast("부서가 추가되었습니다. (프로토타입)", { type: "success" });
		// 폼에 있는 name속성이 있는 요소를 가지고 서버로 전송
		// name속성=value속성
		saveForm.submit();
      });
    });
  </script>
</body>
</html>
